  <rect class="bg" width="880" height="372" rx="14"/>
  <text class="lab" x="24" y="32">ONE REAL ANSWER, CHECKED STATEMENT BY STATEMENT · QUESTION Q0031</text>
  <text class="q" x="24" y="56">Q: Under the Agency Agreement between Biopure Corporation and Agent, what limits apply to assigning</text>
  <text class="q" x="24" y="74">the agreement, including when a party changes control?</text>

  <g class="s1">
    <rect class="card" x="24" y="92" width="410" height="98" rx="8"/>
    <text class="lab" x="38" y="112">STATEMENT 1</text>
    <text class="st" x="38" y="134">Neither party may assign or transfer rights or</text>
    <text class="st" x="38" y="153">obligations without the express prior written</text>
    <text class="st" x="38" y="172">consent of the other party <tspan class="cite">[2]</tspan></text>
  </g>
  <path class="arrow a1" d="M436 141 H 472"/><path d="M466 136 L474 141 L466 146" fill="none" stroke="#737B8A" stroke-width="1.5" class="e1"/>
  <g class="e1">
    <rect class="ex" x="480" y="92" width="376" height="68" rx="8"/>
    <text class="exl" x="494" y="111">EXCERPT [2] · PAGE 1 · THE PREAMBLE</text>
    <text class="ext" x="494" y="131">“This ‘Agency’ Agreement is made as of March 29, 1999,</text>
    <text class="ext" x="494" y="149">by and between Biopure Corporation, a Delaware…”</text>
  </g>
  <text class="no v1" x="494" y="182">✗ not supported: [2] doesn’t contain this rule</text>

  <g class="s2">
    <rect class="card" x="24" y="202" width="410" height="116" rx="8"/>
    <text class="lab" x="38" y="222">STATEMENT 2</text>
    <text class="st" x="38" y="244">If there is a material change in the organization,</text>
    <text class="st" x="38" y="263">ownership, management, or control of the Agent’s</text>
    <text class="st" x="38" y="282">business, the Company may terminate the</text>
    <text class="st" x="38" y="301">Agreement upon giving written notice <tspan class="cite">[3]</tspan></text>
  </g>
  <path class="arrow a2" d="M436 256 H 472"/><path d="M466 251 L474 256 L466 261" fill="none" stroke="#737B8A" stroke-width="1.5" class="e2"/>
  <g class="e2">
    <rect class="ex" x="480" y="202" width="376" height="86" rx="8"/>
    <text class="exl" x="494" y="221">EXCERPT [3] · PAGES 5–6 · 4. TERM AND TERMINATION</text>
    <text class="ext" x="494" y="241">“(b) In the event of any material change in the</text>
    <text class="ext" x="494" y="259">organization, ownership, management or control of the</text>
    <text class="ext" x="494" y="277">business of the Agent, the Company may, at its option…”</text>
  </g>
  <text class="yes v2" x="494" y="310">✓ supported by its own excerpt</text>

  <g class="scores">
    <rect class="chip" x="24" y="330" width="170" height="28" rx="6" fill="#F7DEDF" stroke="#C0272D"/>
    <text class="chipt" x="36" y="349" fill="#C0272D">faithfulness 0.50</text>
    <rect class="chip" x="204" y="330" width="196" height="28" rx="6" fill="#FFFFFF" stroke="#D8D6CE"/>
    <text class="chipt" x="216" y="349" fill="#1A2233">citation validity 1.00</text>
    <rect class="chip" x="410" y="330" width="224" height="28" rx="6" fill="#DFF0E4" stroke="#2E7D4F"/>
    <text class="chipt" x="422" y="349" fill="#2E7D4F">correctness: correct 1.0</text>
    <text class="cap" x="648" y="342">Right answer, wrong citation:</text>
    <text class="cap" x="648" y="359">so the two are scored apart.</text>
  </g>
