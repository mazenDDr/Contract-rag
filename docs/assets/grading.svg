<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" role="img" aria-label="A real answer graded statement by statement. Statement one cites excerpt 2, the preamble, which does not contain the assignment rule: not supported. Statement two cites excerpt 3, which states the change-of-control termination right: supported. Faithfulness 0.50, citation validity 1.00, correctness: correct.">
