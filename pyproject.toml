[project]
name = "contract-rag"
version = "0.1.0"
description = "Hybrid RAG over CUAD legal contracts with an ablation + failure-analysis eval harness"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "orjson>=3.10",
  "tiktoken>=0.7",
  "pymupdf>=1.24",
  "nltk>=3.8",
  "bm25s>=0.2",
  "PyStemmer>=2.2",
  "qdrant-client>=1.10",
  "sentence-transformers>=3.0",
  "openai>=1.40",
  "ollama>=0.5",
  "pandas>=2.2",
  "rapidfuzz>=3.9",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
ui = ["streamlit>=1.36"]
dev = ["pytest>=8.2", "ruff>=0.5", "pytest-mock>=3.14"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
