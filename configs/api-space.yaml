# The API as served on the Hugging Face Space: the same setup as configs/api.yaml (fixed chunks + BM25
# inside the contract, top 8, qwen3.5:4b), with the model server inside the same container.
retrieval_config: configs/retrieval.yaml
documents_path: data/processed/documents.jsonl
retrieval:
  chunking: fixed
  sparse: true
  k_final: 8
  doc_filter: true
generator:
  model: qwen3.5:4b
  host: http://127.0.0.1:11434
max_question_chars: 500
host: 127.0.0.1
port: 8000
log_path: runs/api/requests.jsonl
